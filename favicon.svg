<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: rounded dark square -->
  <rect width="512" height="512" rx="96" fill="#1A1A18"/>

  <!-- House silhouette in gold -->
  <!-- Roof triangle -->
  <polygon points="256,96 420,272 92,272" fill="#FFC200"/>
  <!-- Chimney -->
  <rect x="316" y="128" width="44" height="72" fill="#FFC200"/>
  <!-- House body -->
  <rect x="120" y="252" width="272" height="188" rx="8" fill="#FFC200"/>
  <!-- Door cutout (dark) -->
  <rect x="216" y="330" width="80" height="110" rx="10" fill="#1A1A18"/>
  <!-- Door handle -->
  <circle cx="284" cy="390" r="6" fill="#FFC200"/>
  <!-- Left window -->
  <rect x="148" y="302" width="56" height="48" rx="6" fill="#1A1A18"/>
  <!-- Right window -->
  <rect x="308" y="302" width="56" height="48" rx="6" fill="#1A1A18"/>
</svg>
